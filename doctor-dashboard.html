<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="doctor-dashboard-container">
    <header>
      <h1>Doctor Dashboard</h1>
      <div class="doctor-info">
        <p>Welcome, Dr. Smith</p>
        <button id="logout-btn">Logout</button>
      </div>
    </header>
    
    <section class="overview">
      <h2>Overview</h2>
      <div class="overview-stats">
        <div class="stat">
          <h3>Total Appointments Today</h3>
          <p id="appointments-today">5</p>
        </div>
        <div class="stat">
          <h3>Pending Prescriptions</h3>
          <p id="pending-prescriptions">2</p>
        </div>
      </div>
    </section>
 
    <section class="appointments">
      <h2>Upcoming Appointments</h2>
      <table id="appointments-table">
        <thead>
          <tr>
            <th>Patient</th>
            <th>Appointment Time</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <!-- Dynamic content will be loaded here -->
        </tbody>
      </table>
      <button id="add-appointment-btn">Schedule New Appointment</button>
    </section>
 
    <section class="patients">
      <h2>Patients</h2>
      <table id="patients-table">
        <thead>
          <tr>
            <th>Patient Name</th>
            <th>Age</th>
            <th>Medical History</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <!-- Dynamic content will be loaded here -->
        </tbody>
      </table>
    </section>
 
    <section class="prescriptions">
      <h2>Pending Prescriptions</h2>
      <table id="prescriptions-table">
        <thead>
          <tr>
            <th>Patient</th>
            <th>Medication</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <!-- Dynamic content will be loaded here -->
        </tbody>
      </table>
    </section>
  </div>
 
  <script src="doctor-dashboard.js"></script>
</body>
</html>
