<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="admin-dashboard-container">
    <header>
      <h1>Admin Dashboard</h1>
      <div class="admin-info">
        <p>Welcome, Admin</p>
        <button id="logout-btn">Logout</button>
      </div>
    </header>
    
    <section class="overview">
      <h2>Overview</h2>
      <div class="overview-stats">
        <div class="stat">
          <h3>Total Users</h3>
          <p id="total-users">150</p>
        </div>
        <div class="stat">
          <h3>Total Appointments</h3>
          <p id="total-appointments">45</p>
        </div>
        <div class="stat">
          <h3>Total Medical Records</h3>
          <p id="total-records">120</p>
        </div>
      </div>
    </section>
 
    <section class="users">
      <h2>User Management</h2>
      <table id="user-table">
        <thead>
          <tr>
            <th>Username</th>
            <th>Email</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <!-- Dynamic content will be loaded here -->
        </tbody>
      </table>
      <button id="add-user-btn">Add New User</button>
    </section>
 
    <section class="appointments">
      <h2>Appointments</h2>
      <table id="appointments-table">
        <thead>
          <tr>
            <th>Patient</th>
            <th>Doctor</th>
            <th>Date</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <!-- Dynamic content will be loaded here -->
        </tbody>
      </table>
      <button id="add-appointment-btn">Schedule New Appointment</button>
    </section>
  </div>
 
  <script src="admin-dashboard.js"></script>
</body>
</html>
