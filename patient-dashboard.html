<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Patient Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="patient-dashboard-container">
    <header>
      <h1>Patient Dashboard</h1>
      <div class="patient-info">
        <p>Welcome, <span id="patient-name">John Doe</span></p>
        <button id="logout-btn">Logout</button>
      </div>
    </header>
 
    <section class="overview">
      <h2>Overview</h2>
      <div class="overview-stats">
        <div class="stat">
          <h3>Upcoming Appointments</h3>
          <p id="appointment-count">0</p>
        </div>
        <div class="stat">
          <h3>Prescriptions</h3>
          <p id="prescription-count">0</p>
        </div>
      </div>
    </section>
 
    <section class="appointments">
      <h2>Your Appointments</h2>
      <table id="appointments-table">
        <thead>
          <tr>
            <th>Date & Time</th>
            <th>Doctor</th>
            <th>Department</th>
            <th>Gender</th>
            <th>Contact</th>
            <th>Reason</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
 
    <section class="book-appointment">
      <h2>Book Appointment</h2>
      <form id="appointment-form">
        <label for="department">Department:</label>
        <select id="department" required>
          <option value="">-- Select Department --</option>
          <option value="Cardiology">Cardiology</option>
          <option value="Neurology">Neurology</option>
          <option value="Orthopedics">Orthopedics</option>
        </select>
 
        <label for="doctor">Doctor:</label>
        <select id="doctor" required>
          <option value="">-- Choose Doctor --</option>
        </select>
 
        <label for="gender">Gender:</label>
        <input type="text" id="gender" required>
 
        <label for="contact">Contact:</label>
        <input type="text" id="contact" required>
 
        <label for="date">Date:</label>
        <input type="date" id="date" required />
 
        <label for="time">Time:</label>
        <input type="time" id="time" required />
 
        <label for="reason">Reason:</label>
        <textarea id="reason" rows="2" placeholder="Optional..."></textarea>
 
        <button type="submit">Book Appointment</button>
      </form>
    </section>
    
    <section class="profile">
        <h2>Profile</h2>
        <p><strong>Name:</strong> <span id="profile-name">John Doe</span></p>
        <p><strong>Age:</strong> <span id="profile-age">35</span></p>
        <p><strong>Email:</strong> <span id="profile-email">john.doe@example.com</span></p>
        <button id="edit-profile-btn">Edit Profile</button>
       
        <div id="edit-profile-form" style="display: none; margin-top: 10px;">
          <label for="edit-name">Name:</label>
          <input type="text" id="edit-name" /><br/>
       
          <label for="edit-age">Age:</label>
          <input type="number" id="edit-age" /><br/>
       
          <label for="edit-email">Email:</label>
          <input type="email" id="edit-email" /><br/>
       
          <button id="save-profile-btn">Save</button>
          <button id="cancel-edit-btn">Cancel</button>
        </div>
      </section>
 
  <script src="patient-dashboard.js"></script>
</body>
</html>
